name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - run: echo "INBOX_DATA_DIR=$RUNNER_TEMP/ai-inbox-data" >> "$GITHUB_ENV"
      - run: for script in scripts/deploy*.sh; do bash -n "$script"; done
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:backend
      - run: bun run test:frontend
      - run: bun run build
